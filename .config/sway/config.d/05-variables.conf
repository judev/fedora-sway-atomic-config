# Tunables consumed by Fedora's own drop-ins.
#
# Fedora's shipped config.d files (/usr/share/sway/config.d/) are parameterised
# with sway variables that are unset by default. Setting them here means we get
# Fedora's well-tested implementations and only override the numbers, instead
# of reimplementing swayidle / volume / brightness handling ourselves.
#
# ORDERING MATTERS: layered-include sorts by *basename*, so this file must sort
# before the files that consume these variables (60-*, 90-*). Hence the 05- prefix.

### Idle behaviour -- consumed by 90-swayidle.conf
# $lock_timeout   : seconds of inactivity before swaylock runs
# $screen_timeout : extra seconds after locking before the panel powers off
#                   (also: how long a *manual* lock waits before blanking)
# Net effect: lock at 5 minutes, screen off at 10 minutes.
set $lock_timeout 300
set $screen_timeout 300

### Volume keys -- consumed by 60-bindings-volume.conf
set $volume_step 5
set $volume_limit 100

### Brightness keys -- consumed by 60-bindings-brightness.conf
set $brightness_step 5
