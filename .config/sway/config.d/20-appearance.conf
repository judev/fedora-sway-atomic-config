# Appearance: clean and tight.
#
# No gaps, thin borders, no title bars. On a 1920x1080 panel gaps cost real
# estate, so the focused window is distinguished by border colour instead.

font pango:Adwaita Sans 10

default_border pixel 2
default_floating_border pixel 2

# A lone window on a workspace has nothing to be distinguished *from*, so drop
# its border entirely and reclaim the pixels.
hide_edge_borders smart

gaps inner 0
gaps outer 0

# Neutral dark palette. Only the focused window gets a bright border; everything
# else recedes into the background. Colour is reserved for meaning (urgent).
#
#                       border   background  text     indicator  child_border
client.focused          #cdcdcd  #cdcdcd     #1a1a1a  #cdcdcd    #cdcdcd
client.focused_inactive #3a3a3a  #3a3a3a     #b0b0b0  #3a3a3a    #3a3a3a
client.unfocused        #262626  #262626     #6e6e6e  #262626    #262626
client.urgent           #d75f5f  #d75f5f     #1a1a1a  #d75f5f    #d75f5f
client.background       #1a1a1a

# Fedora's /etc/sway/config sets a wallpaper by default. To match the flat dark
# theme instead, uncomment the line below.
# output * bg #1a1a1a solid_color
