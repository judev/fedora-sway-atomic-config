# Extra key bindings.
#
# Only additions live here. The basics -- $mod+Return terminal, $mod+d launcher,
# $mod+Shift+q kill, hjkl/arrow focus and move, workspaces 1-0, splits, layouts,
# fullscreen, scratchpad, resize mode -- are already defined in /etc/sway/config,
# and the media/volume/brightness/screenshot keys in /usr/share/sway/config.d/.
# Run `swaymsg -t get_binding_modes` and read those files before adding here, so
# you do not silently shadow an existing binding.

### Session

# Lock.
#
# swaylock first, loginctl only as a fallback -- NOT the other way round.
#
# `loginctl lock-session` does not lock anything itself; it emits a signal that
# something must act on, and swayidle's `lock` handler (90-swayidle.conf) is the
# only consumer on this system -- there is no xss-lock, systemd-lock-handler or
# gnome-shell here to pick it up. So if swayidle has died, `loginctl
# lock-session` flips LockedHint, draws nothing, and still reports success: you
# walk away believing the machine is locked. Calling swaylock directly fails
# loudly instead.
#
# Pressing this twice is safe: swaylock is an ext-session-lock-v1 client, and
# the protocol allows only one active lock per session -- a second instance is
# sent `finished` by the compositor and exits rather than displacing the first.
set $lock_cmd swaylock -f || loginctl lock-session
bindsym $mod+Shift+x exec $lock_cmd

set $power_menu swaynag -t warning -m 'Session' \
    -B 'Lock' '$lock_cmd' \
    -B 'Suspend' 'systemctl suspend' \
    -B 'Log out' 'swaymsg exit' \
    -B 'Reboot' 'systemctl reboot' \
    -B 'Shut down' 'systemctl poweroff'
bindsym $mod+Shift+p exec $power_menu

### Applications

bindsym $mod+Shift+Return exec thunar

### Bar

# Waybar toggles its own visibility on SIGUSR1.
bindsym $mod+n exec pkill -SIGUSR1 waybar

### Screenshots
#
# Fedora binds bare Print / Alt+Print / Ctrl+Print to *save* to a file.
# These $mod variants put the image on the clipboard instead.
bindsym $mod+Print exec grimshot copy output
bindsym $mod+Shift+Print exec grimshot copy area
bindsym $mod+Ctrl+Print exec grimshot copy active

### Workspaces

bindsym $mod+Tab workspace back_and_forth
bindsym $mod+Ctrl+Right workspace next
bindsym $mod+Ctrl+Left workspace prev
