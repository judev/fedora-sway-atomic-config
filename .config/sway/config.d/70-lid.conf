# Laptop lid.
#
# logind's default is HandleLidSwitch=suspend, and swayidle's `before-sleep`
# handler already locks on the way into suspend. This binding covers the case
# where suspend is inhibited -- on AC, docked, or during a long-running job --
# where otherwise the lid would close onto an unlocked, still-lit session.
#
# --locked  : fires even while swaylock is already up
# --reload  : re-evaluates the current lid state on config reload, so reloading
#             with the lid shut still locks

bindswitch --reload --locked lid:on exec $lock_cmd

# Lock only -- the panel is deliberately NOT powered off here.
#
# An earlier version ran `loginctl lock-session; swaymsg "output eDP-1 power
# off"`. Two problems:
#
#   1. Race. The power-off fires immediately while swaylock still has to map its
#      surface, so closing and instantly reopening the lid could show the
#      desktop. Worse, a dark panel then *looks* locked whether or not it is.
#   2. Redundant. logind suspends on lid close by default, and when suspend is
#      inhibited swayidle's own $screen_timeout blanks the panel anyway.
#
# $lock_cmd is defined in 35-bindings.conf (swaylock direct, loginctl fallback)
# so the lid, the keybinding and the session menu all lock the same way.
#
# If you do want the panel off with the lid shut while docked, drive it off the
# lock instead of racing it, and name eDP-1 explicitly rather than `output *`
# so an external display keeps working.
