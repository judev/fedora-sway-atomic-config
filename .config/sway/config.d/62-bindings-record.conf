# Screen recording.
#
# Requires two layered packages -- this is the one part of the config that is
# not satisfied by the stock Sway Atomic image:
#
#   rpm-ostree override remove noopenh264 --install openh264 --install wf-recorder
#
# openh264 must go in as an *override* rather than a plain install: the base
# image ships noopenh264, a stub that satisfies the same soname but refuses to
# encode ("Unable to create encoder"). openh264 Obsoletes it, and swapping a
# base-image package is what `override remove` is for. It comes from the
# fedora-cisco-openh264 repo, which is enabled by default.
#
# All the actual logic lives in ~/.config/sway/scripts/record.sh -- see the
# comment there for why the codecs are pinned explicitly.

set $rec $HOME/.config/sway/scripts/record.sh

### Stop
#
# Bound outside the mode, and --locked, so a recording can always be stopped
# without first entering a mode. Forgetting to stop a recording fills the disk.
bindsym --locked $mod+Shift+s exec $rec stop

### Start
#
# $mod+Shift+r enters a mode, mirroring the screenshot mode. waybar's sway/mode
# module shows "recording" while it is open.
bindsym $mod+Shift+r mode "recording"

mode "recording" {
    # Targets:
    #   r  region -- drag out an area with slurp
    #   o  output -- the focused display
    #   s  screen -- everything
    #
    # Audio (plain / Shift / Ctrl):
    #   plain  system audio (the default sink's monitor)
    #   Shift  silent
    #   Ctrl   narrate: system audio and microphone mixed

    bindsym r mode "default", exec $rec start region system
    bindsym o mode "default", exec $rec start output system
    bindsym s mode "default", exec $rec start screen system

    bindsym Shift+r mode "default", exec $rec start region none
    bindsym Shift+o mode "default", exec $rec start output none
    bindsym Shift+s mode "default", exec $rec start screen none

    bindsym Ctrl+r mode "default", exec $rec start region narrate
    bindsym Ctrl+o mode "default", exec $rec start output narrate
    bindsym Ctrl+s mode "default", exec $rec start screen narrate

    bindsym Escape mode "default"
    bindsym Return mode "default"
    bindsym $mod+Shift+r mode "default"
}

# Note: wf-recorder 0.6 has no cursor flag -- nothing for it in the option list,
# and it calls zwlr_screencopy_manager_v1 with a hardcoded overlay_cursor.
# Confirmed by recording with the pointer parked over static content and
# examining an extracted frame: the cursor IS drawn. So recordings always
# include the pointer, and unlike screenshots that cannot be turned off.
