# Clipboard history.
#
# Needs one layered package:
#
#   rpm-ostree install cliphist
#
# wl-clipboard and rofi are already in the base image. Storage tunables are in
# ~/.config/cliphist/config; the logic is in ~/.config/sway/scripts/clipboard.sh.

set $clip $HOME/.config/sway/scripts/clipboard.sh

### Watchers
#
# One per MIME class, as cliphist's readme recommends: a single watcher without
# --type would only ever see one flavour of the offer, so images would be lost.
# The script drops anything wl-paste flags as CLIPBOARD_STATE=sensitive.
#
# `exec`, not `exec_always`: these are long-lived daemons and must start exactly
# once per session. exec_always would spawn an additional pair on every config
# reload, and each duplicate would store every copy again. The cost is that
# adding these takes effect on next login, not on `swaymsg reload` -- start them
# by hand this once if you do not want to log out:
#   wl-paste --type text  --watch ~/.config/sway/scripts/clipboard.sh store &
#   wl-paste --type image --watch ~/.config/sway/scripts/clipboard.sh store &
exec wl-paste --type text --watch $clip store
exec wl-paste --type image --watch $clip store

### Picker
#
# Super+V is what /etc/sway/config binds to `splitv`. This drop-in is included
# at the end of that file, so re-binding it here simply wins. splitv is moved
# to Super+Shift+V rather than dropped -- splith stays on Super+B, so losing
# only the vertical half would be an odd asymmetry.
#
# --no-warn is required, not cosmetic. Overwriting an existing binding makes
# sway raise a swaynag banner over the session on every login; the flag exists
# for exactly this case, where the override is deliberate. Note that
# `sway --validate` does NOT catch this -- it exits 0 and prints nothing,
# because the warning is emitted at runtime rather than during parsing. This is
# the only binding in this config that overrides one of Fedora's; check with:
#   swaymsg -t get_config | grep bindsym    # against .config/sway/config.d/
bindsym --no-warn $mod+v exec $clip pick
bindsym $mod+Shift+v splitv

# Deleting a single entry and wiping the history are both reachable from inside
# the picker (Alt+Delete and Alt+Shift+Delete), so they get no global binding.
# Keeping them behind the picker means you are always looking at what you are
# about to discard.
