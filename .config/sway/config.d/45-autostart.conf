# Autostarted programs.
#
# Deliberately short. Things that are already handled elsewhere and must NOT be
# duplicated here:
#
#   - polkit agent   -- Fedora starts lxqt-policykit-agent in
#                       /usr/share/sway/config.d/95-autostart-policykit-agent.conf
#   - notifications  -- dunst is D-Bus activated via org.knopwob.dunst.service,
#                       so it starts on the first notification. No exec needed.
#   - swayidle       -- started by 90-swayidle.conf, tuned in 05-variables.conf
#   - waybar         -- started as sway's bar via 90-bar.conf
#   - session/env    -- sway-systemd handles XDG_CURRENT_DESKTOP, SWAYSOCK,
#                       dbus activation environment and sway-session.target
#                       via /etc/sway/config.d/10-systemd-session.conf
#   - nm-applet      -- /etc/xdg/autostart/nm-applet.desktop, launched by
#                       Fedora's 95-xdg-desktop-autostart.conf. Adding an exec
#                       line for it here gives you two tray icons. It needs a
#                       StatusNotifier host, which waybar's tray module is.

# Low-battery warnings, aware of both of the T480's batteries.
exec --no-startup-id $HOME/.config/sway/scripts/battery-notify.sh
