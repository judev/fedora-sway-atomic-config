# Screenshots.
#
# This filename is intentional: layered-include merges by basename, so this file
# REPLACES Fedora's /usr/share/sway/config.d/60-bindings-screenshot.conf rather
# than adding to it. That is the point -- otherwise Fedora's save-to-file
# bindings (Print / Alt+Print / Ctrl+Print) and these would coexist as two
# half-overlapping schemes with no cursor support in either.
#
# Everything here is grimshot, which ships with Fedora's sway (in sway-config-
# fedora) and wraps grim + slurp + wl-copy. Verify its dependencies with
# `grimshot check`.
#
# Saved files land in grimshot's default target: $XDG_SCREENSHOTS_DIR, else
# $XDG_PICTURES_DIR, else $HOME -- read from ~/.config/user-dirs.dirs. On this
# system that resolves to ~/Pictures. To tuck them into a subfolder, add
#   XDG_SCREENSHOTS_DIR="$HOME/Pictures/Screenshots"
# to ~/.config/user-dirs.dirs and create the directory.

# --notify is on everywhere on purpose. A clipboard-only capture leaves no
# artifact on disk, so without a notification there is no confirmation that
# anything happened at all.
set $shot grimshot --notify

# --cursor must precede the action verb (grimshot parses options first).
set $shot_ptr grimshot --notify --cursor

### Fast path
#
# Region to clipboard is the overwhelmingly common case, so it gets a bare key.
# Note this replaces Fedora's Print, which saved the whole output to a file.
bindsym Print exec $shot copy area

### Everything else lives in a mode
#
# waybar's sway/mode module displays "screenshot" while this is active, so the
# available actions are discoverable rather than memorised.
#
# Each binding returns to the default mode BEFORE running grimshot. That order
# matters: the mode grabs the keyboard, and slurp needs Escape to cancel a
# selection.
bindsym $mod+Print mode "screenshot"

mode "screenshot" {
    # Targets:
    #   a  area    -- drag out a region
    #   w  window  -- click to pick a window
    #   o  output  -- the current output, whole
    #   s  screen  -- every visible output (same as o on a single display)
    #   f  focused -- the active window, no clicking

    # Plain: to clipboard only.
    bindsym a mode "default", exec $shot copy area
    bindsym w mode "default", exec $shot copy window
    bindsym o mode "default", exec $shot copy output
    bindsym s mode "default", exec $shot copy screen
    bindsym f mode "default", exec $shot copy active

    # Shift: include the mouse pointer.
    bindsym Shift+a mode "default", exec $shot_ptr copy area
    bindsym Shift+w mode "default", exec $shot_ptr copy window
    bindsym Shift+o mode "default", exec $shot_ptr copy output
    bindsym Shift+s mode "default", exec $shot_ptr copy screen
    bindsym Shift+f mode "default", exec $shot_ptr copy active

    # Ctrl: also write a timestamped file (savecopy = file AND clipboard).
    bindsym Ctrl+a mode "default", exec $shot savecopy area
    bindsym Ctrl+w mode "default", exec $shot savecopy window
    bindsym Ctrl+o mode "default", exec $shot savecopy output
    bindsym Ctrl+s mode "default", exec $shot savecopy screen
    bindsym Ctrl+f mode "default", exec $shot savecopy active

    # Ctrl+Shift: pointer and a file.
    bindsym Ctrl+Shift+a mode "default", exec $shot_ptr savecopy area
    bindsym Ctrl+Shift+w mode "default", exec $shot_ptr savecopy window
    bindsym Ctrl+Shift+o mode "default", exec $shot_ptr savecopy output
    bindsym Ctrl+Shift+s mode "default", exec $shot_ptr savecopy screen
    bindsym Ctrl+Shift+f mode "default", exec $shot_ptr savecopy active

    bindsym Escape mode "default"
    bindsym Return mode "default"
    bindsym $mod+Print mode "default"
}
