# Window rules.
#
# Fedora already floats pavucontrol (50-rules-pavucontrol.conf) and the polkit
# agent (50-rules-policykit-agent.conf), so those are not repeated here.

### Floating

# Transient windows that are not documents: dialogs, pickers, alerts.
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable

for_window [app_id="nm-connection-editor"] floating enable
for_window [app_id="blueman-manager"] floating enable

# Thunar's progress and confirmation windows, not its main browser window.
for_window [app_id="thunar" title="^(File Operation Progress|Confirm)"] floating enable

### Idle inhibition
#
# Fedora's 50-rules-browser.conf inhibits idle for fullscreen browsers, but it
# matches app_id="firefox" -- and Fedora's own Firefox reports
# app_id="org.mozilla.firefox", so that rule silently misses. Cover it here.
for_window [app_id="org.mozilla.firefox"] inhibit_idle fullscreen

# Deliberately NOT a blanket rule.
#
# `for_window [app_id=".*"] inhibit_idle fullscreen` looks harmless but is a
# complete bypass of the idle lock: per `man 5 sway`, `fullscreen` inhibits idle
# whenever the view is fullscreen and visible, so *any* fullscreen window --
# including a password manager -- keeps the machine awake and unlocked
# indefinitely. Fedora scopes the same inhibitor to browsers only, for this
# reason. Add apps here individually and only when they need it.
#
# Verify what is actually set with:
#   swaymsg -t get_tree | grep -o '"idle_inhibitors":[^}]*}'
