# Input devices -- ThinkPad T480.

# KEYBOARD
#
# Sway reads neither /etc/vconsole.conf (which the TTY uses) nor
# /etc/X11/xorg.conf.d/00-keyboard.conf (which localectl writes and Xorg uses).
# It falls back to XKB's compiled-in "us" default, which is why the TTY can be
# correctly set to gb while sway is still US. The layout has to be declared
# here explicitly. If you change it with localectl later, change it here too.
input type:keyboard {
    xkb_layout gb
    xkb_model pc105

    repeat_delay 250
    repeat_rate 35

    # Caps Lock acts as a second Ctrl, and there is no Caps Lock any more.
    # Use ctrl:swapcaps instead if you want to keep Caps Lock, moved onto the
    # old Ctrl key. Full list: /usr/share/X11/xkb/rules/base.lst (grep ctrl:).
    #
    # This only affects the sway session. TTY consoles read /etc/vconsole.conf
    # and are unaffected -- see the note below.
    xkb_options ctrl:nocaps
}

# TOUCHPAD -- SynPS/2 Synaptics TouchPad
input type:touchpad {
    tap enabled
    natural_scroll enabled
    scroll_method two_finger

    # Suppress the pad while typing; the T480's pad sits right under the
    # space bar and is easy to brush.
    dwt enabled

    # Count fingers rather than dividing the pad into button zones, so a
    # two-finger tap is right-click anywhere.
    click_method clickfinger

    accel_profile adaptive
    pointer_accel 0.3
}

# TRACKPOINT
#
# Matched by identifier rather than `type:pointer`, because the touchpad also
# registers as a pointer and these settings should not apply to it.
input "2:10:TPPS/2_IBM_TrackPoint" {
    accel_profile adaptive
    pointer_accel 0.4

    # Hold the middle button and push the stick to scroll -- the whole point of
    # the three-button cluster above the touchpad.
    scroll_method on_button_down
    scroll_button button2

    # The middle button is doing scroll duty, so it must not also be
    # synthesised from left+right chords.
    middle_emulation disabled
}
