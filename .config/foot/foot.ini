# foot -- Wayland-native terminal, ships with Sway Atomic.
# Full reference: man 5 foot

font=Adwaita Mono:size=14
pad=8x8
term=foot

# foot scales itself from the output's scale factor rather than font DPI, which
# is what you want on a single-scale laptop panel.
dpi-aware=no

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3

[key-bindings]
# Ctrl+Shift+U by default is unicode-input; leave the rest at defaults.

# foot 1.27 deprecated a bare [colors] section in favour of [colors-dark] /
# [colors-light]. colors-dark is the theme used by default (foot only picks
# colors-light if initial-color-theme=light), so defining just this one is
# enough for an all-dark setup.
[colors-dark]
alpha=1.0

# Neutral dark base, matched to the sway and waybar palettes. The ANSI colours
# are deliberately desaturated -- readable against #1a1a1a without glare.
background=1a1a1a
foreground=d4d4d4

selection-background=3a3a3a
selection-foreground=f0f0f0

## normal/regular
regular0=1a1a1a
regular1=cc6666
regular2=8fbf7f
regular3=d7a65f
regular4=7f9fbf
regular5=b48ead
regular6=8abeb7
regular7=d4d4d4

## bright
bright0=4a4a4a
bright1=e08a8a
bright2=a8d69a
bright3=e5c07b
bright4=9db8d4
bright5=c9a4c4
bright6=a3d4cd
bright7=f0f0f0
